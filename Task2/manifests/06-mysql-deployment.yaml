apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: webapp-stack
spec:
  replicas: 1
  strategy:
    type: Recreate          # never run two MySQL writers on one RWO volume
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # Must run on minikube-m02 — that is where the hostPath PV lives
      nodeSelector:
        kubernetes.io/hostname: minikube-m02

      containers:
        - name: mysql
          image: webapp-mysql:task2
          imagePullPolicy: IfNotPresent   # use the locally-loaded image
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
